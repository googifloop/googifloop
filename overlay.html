<!-- sound option -->
<div class="footer">
    <img id="muteButton" src="/resources/img/main/muteButtonmuted.png" onclick="toggleSound()" onload="updateGraphics()">

    <p id="commit">loading...</p>
</div>

<script>
    const muteButton = document.getElementById("muteButton");

    if (!localStorage.getItem("soundsOn")) {
        localStorage.setItem("soundsOn", "muted");
    }

    function toggleSound() {
        let currentState = localStorage.getItem("soundsOn");

        if (currentState === "unmuted") {
            localStorage.setItem("soundsOn", "muted");
            if (typeof track !== 'undefined') track.pause();
            document.body.classList.add('is-muted');
        } else {
            localStorage.setItem("soundsOn", "unmuted");
            if (typeof track !== 'undefined') track.play();
            document.body.classList.remove('is-muted');
        }
        
        updateGraphics();
    }

    function updateGraphics() {
        const state = localStorage.getItem("soundsOn");
        if (state === "muted") {
            muteButton.src = "/resources/img/main/muteButtonmuted.png";
            document.body.classList.add('is-muted');
        } else {
            muteButton.src = "/resources/img/main/muteButton.png";
            document.body.classList.remove('is-muted');
        }
    }

    updateGraphics();
</script>
