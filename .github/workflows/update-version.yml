name: Update Version File
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: write ver to version.txt and COMMIT link to link2commit.txt
        run: |
          echo "commit <a href='https://github.com{{ github.repository }}/commit/${{ github.sha }}'>$(git rev-parse --short HEAD)</a> ($(date +'%m/%d/%Y'))" > version.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add version.txt
          git commit -m "chore: update version.txt [skip ci]" || exit 0
          git push