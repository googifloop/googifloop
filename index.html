						<script>
							function spawnSnap(trig) {
								var burp = new Howl({
									src: [
										"/resources/audio/graceSelectModifier.mp3",
									],
								});
								if (localStorage.soundsOn === "unmuted") {
									burp.play();
								}
								trig.remove();

								const element = document.getElementById("snap");
								const runSrc =
									"https://static.wikitide.net/gracewiki/d/d5/Snapcats_Running.gif";
								const idleSrc =
									"https://static.wikitide.net/gracewiki/9/96/Snapcat_Idle.gif";

								element.style.display = "block";

								const gravity = 0.1;
								const friction = 0.95;
								const speed = 4;

								let state = "running";
								let entering = true;

								let posX, velX;
								if (Math.random() > 0.5) {
									posX = -300;
									velX = speed;
								} else {
									posX = window.innerWidth + 300;
									velX = -speed;
								}
								let posY = 1000;
								let velY = 0;
								let rotation = 0;

								function update() {
									const floor =
										window.innerHeight -
										element.clientHeight;
									const rightEdge =
										window.innerWidth - element.clientWidth;

									velY += gravity;
									posY += velY;

									if (posY >= floor) {
										posY = floor;
										velY = 0;

										if (state === "idling") {
											velX *= friction;
											if (Math.abs(velX) < 0.1) velX = 0;
										}
									}

									posX += velX;

									if (state === "running") {
										if (
											posY === floor &&
											Math.random() < 0.01
										) {
											velY = -6;
										}
									}

									if (posX > rightEdge) {
										posX = rightEdge;
										velX *= -1;
										if (posY < floor) rotation = 360;
										velY = -6;
									} else if (posX < 0 && !entering) {
										posX = 0;
										velX *= -1;
										if (posY < floor) rotation = 360;
										velY = -6;
									}

									rotation *= 0.92;
									if (Math.abs(rotation) < 0.1) rotation = 0;

									let direction = velX < 0 ? -1 : 1;

									element.style.transform = `translate(${posX}px, ${posY}px) scaleX(${direction}) rotate(${rotation}deg)`;

									requestAnimationFrame(update);
								}

								setTimeout(() => {
									entering = false;
									decideNextAction();
								}, 2000);

								function decideNextAction() {
									if (entering) return;

									if (Math.random() < 0.6) {
										state = "running";
										element.src = runSrc;
										if (Math.abs(velX) < 0.1) {
											velX =
												(Math.random() > 0.5 ? 1 : -1) *
												speed;
										}

										let currentDir = velX >= 0 ? 1 : -1;
										velX = currentDir * speed;
									} else {
										state = "idling";
										element.src = idleSrc;
									}

									setTimeout(
										decideNextAction,
										2000 + Math.random() * 1,
									);
								}

								// start the loop
								update();
								decideNextAction();
							}
						</script>
