<!-- sound option -->
<div class="footer">
    <img id="muteButton" src="/resources/img/main/muteButtonmuted.png" onclick="toggleSound()">
</div>

<script>
    const muteButton = document.getElementById("muteButton");
    
    if (typeof(Storage) === "undefined") {
        localStorage.setItem("soundsOn", "muted");
        muteButton.src = "/resources/img/main/muteButtonmuted.png"
    }

    function toggleSound() {
        if (localStorage.soundsOn === "unmuted") {
            localStorage.setItem("soundsOn", "muted");
            muteButton.src = "/resources/img/main/muteButtonmuted.png"
        } else {
            localStorage.setItem("soundsOn", "unmuted");
            muteButton.src = "/resources/img/main/muteButton.png"
        }
    }

    function updateGraphics() {
        if (localStorage.soundsOn === "muted") {
            muteButton.src = "/resources/img/main/muteButtonmuted.png"
        } else {
            muteButton.src = "/resources/img/main/muteButton.png"
        }
    }

    updateGraphics()
</script>

<!-- ui sounds yay. -->
<script>
    const selectSound = new Audio("/resources/audio/SELECT.mp3");
    const confirmSound = new Audio("/resources/audio/CONFIRM.mp3");
    const confirm2Sound = new Audio("/resources/audio/CONFIRM2.mp3");
    const backSound = new Audio("/resources/audio/BACK.mp3");

    const huh = new Audio("/resources/audio/huh.mp3");

    $(document).ready(function(){
        $(document).on("mouseenter", ".uiSounds", function() {
            if (localStorage.soundsOn === "unmuted") {
                const selectSound1 = selectSound.cloneNode(true);
                selectSound1.volume = 0.5;
                selectSound1.cloneNode(true).play();
            }
        });
        $(document).on("mousedown", ".uiSounds", function() {
            if (localStorage.soundsOn === "unmuted") {
                confirmSound.cloneNode(true).play();
            }
        });

        $(document).on("mouseenter", ".uiSounds2", function() {
            if (localStorage.soundsOn === "unmuted") {
                const selectSound2 = selectSound.cloneNode(true);
                selectSound2.volume = 0.5;
                selectSound2.cloneNode(true).play();
            }
        });
        $(document).on("mousedown", ".uiSounds2", function() {
            if (localStorage.soundsOn === "unmuted") {
                confirm2Sound.cloneNode(true).play();
            }
        });

        $(document).on("mouseenter", ".uiSounds3", function() {
            if (localStorage.soundsOn === "unmuted") {
                const selectSound3 = selectSound.cloneNode(true);
                selectSound3.volume = 0.5;
                selectSound3.cloneNode(true).play();
            }
        });
        $(document).on("mousedown", ".uiSounds3", function() {
            if (localStorage.soundsOn === "unmuted") {
                backSound.cloneNode(true).play();
            }
        });



        $(document).on("mouseenter", ".uiSoundsCat", function() {
            if (localStorage.soundsOn === "unmuted") {
                const clonedHuh = huh.cloneNode(true);
                clonedHuh.volume = 0.1;
                clonedHuh.play();
            }
        });
    });
</script>
